name = "malumotnoma-bot"
main = "src/index.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# Shriftlar (TTF) Worker ichiga ikkilik ma'lumot sifatida qo'shiladi
[[rules]]
type = "Data"
globs = ["**/*.ttf", "**/*.jpg"]
fallthrough = true

# Har kuni 02:17 (UTC) da 30 kundan eski anketalar bazadan o'chiriladi
[triggers]
crons = ["17 2 * * *"]

# Cloudflare Workers AI — to'lov chekini tekshirish uchun
[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "malumotnoma"
database_id = "1a9a563e-0a3b-463d-a24d-0635aa69e6ae"

[vars]
PRICE = "5000"
PAYMENT_PROVIDER = "manual"   # keyinchalik: "payme" yoki "stars"
# Maxfiy qiymatlar (wrangler secret put ...):
#   BOT_TOKEN, ADMIN_ID, CARD_NUMBER, CARD_OWNER, WEBHOOK_SECRET
